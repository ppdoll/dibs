# 로컬 개발용 Postgres.
#
# 운영은 Vercel Postgres(Neon)를 쓰지만, 로컬에서 F5 한 번으로 돌리려면 DB가 하나 있어야 한다.
# 이미 쓰는 Postgres 가 있으면 이 파일은 무시하고 apps/api/.env 만 그쪽으로 맞추면 된다.
#
#   docker compose up -d      띄우기
#   docker compose down       내리기 (데이터는 볼륨에 남는다)
#   docker compose down -v    볼륨까지 삭제 — 완전 초기화
services:
  postgres:
    image: postgres:16-alpine
    container_name: dibs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dibs
      POSTGRES_PASSWORD: dibs
      POSTGRES_DB: dibs
      # 한글 정렬·비교를 제대로 하려면 초기화 시점에 잡아야 한다. 나중에는 못 바꾼다.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # 5432 는 이미 쓰고 있을 확률이 높아 한 칸 옆으로 뺐다.
      # apps/api/.env 의 DATABASE_URL 포트와 반드시 같아야 한다.
      - '5433:5432'
    volumes:
      - dibs-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dibs -d dibs']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dibs-pgdata:
